<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="324" viewBox="0 0 1280 324" role="img" aria-labelledby="title desc">
  <title id="title">The crew — Zoro, Lucy, Franky, Nami and Robin</title>
  <desc id="desc">Five individual paw-print stamps on a cream ship's manifest. One Piece names and a family of five pets.</desc>
  <defs>
